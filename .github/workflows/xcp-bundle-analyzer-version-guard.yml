name: xcp-bundle-analyzer-version-guard

# Enforces the repo rule "every change to xcp-bundle-analyzer/ bumps the
# version in Cargo.toml" so the auto-release workflow
# (xcp-bundle-analyzer-release, runs on merges to main) always has a new
# version to publish and a release is never missed. Fails the PR if
# xcp-bundle-analyzer/ changed but the version in Cargo.toml did not.

"on":
  pull_request:
    paths: ["xcp-bundle-analyzer/**"]

permissions:
  contents: read
  pull-requests: read

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check Cargo.toml version bumped when xcp-bundle-analyzer/ changed
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -q '^xcp-bundle-analyzer/'; then
            if git diff --quiet "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- xcp-bundle-analyzer/Cargo.toml; then
              echo "::error::xcp-bundle-analyzer/ changed but the version in xcp-bundle-analyzer/Cargo.toml was not bumped. Bump the version (repo rule: every commit bumps z, features bump y) so the auto-release publishes it."
              exit 1
            fi
            OLD="$(git show ${{ github.event.pull_request.base.sha }}:xcp-bundle-analyzer/Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
            NEW="$(sed -n 's/^version = "\(.*\)"/\1/p' xcp-bundle-analyzer/Cargo.toml | head -1)"
            echo "version bumped: $OLD -> $NEW"
          fi
