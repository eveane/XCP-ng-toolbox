name: xoa-support-release

# Publishes the self-contained xoa-support .deb as a GitHub Release asset.
#
# Primary trigger: every merge/push to main that changes xoa-support/ and
# bumps xoa-support/VERSION -> release "xoa-support-v<VERSION>" is created
# (or updated) automatically. Nothing to remember when approving a PR.
#
# Manual/tag fallbacks still work:
#   - push of a tag xoa-support-vX.Y.Z
#   - workflow_dispatch (optional version input)

"on":
  push:
    branches: [main]
    paths: ["xoa-support/**"]
    tags: ["xoa-support-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.7); defaults to xoa-support/VERSION"
        required: false
        default: ""

permissions:
  contents: write   # create/update the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    # on branch pushes, the paths: filter above already limits this to
    # xoa-support/ changes; no extra if needed
    defaults:
      run:
        working-directory: xoa-support
    steps:
      - uses: actions/checkout@v4
      - name: resolve version
        id: ver
        run: |
          V="${{ inputs.version }}"
          [ -n "$V" ] || V="$(cat VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=xoa-support-v$V" >> "$GITHUB_OUTPUT"
      - name: build the deb
        run: |
          ./packaging/build-deb.sh dist
          sha256sum dist/*.deb > dist/SHA256SUMS
          dpkg-deb --info dist/xoa-support_*_all.deb | head -12
      - name: create or update release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          DEB=$(ls dist/xoa-support_*_all.deb)
          cat > /tmp/release-notes.md <<NOTES
          ## xoa-support v${VERSION}

          Self-contained \`xoa-support_${VERSION}_all.deb\` (Architecture: all).

          ### Install on the XOA (works airgapped — one file, local \`dpkg -i\`)

              wget https://github.com/eveane/XCP-ng-toolbox/releases/latest/download/$(basename "$DEB")
              sha256sum -c SHA256SUMS
              sudo dpkg -i $(basename "$DEB")

          Commands installed: \`xoa-support-collect\`, \`xoa-scrub\`, \`xoa-bundle-inspect\`.
          If sos is installed, the xoa plugin is registered automatically
          (\`sos report --batch -o xoa\`).

          Built from commit ${{ github.sha }}.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists -> updating assets"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$DEB" dist/SHA256SUMS
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-notes.md --latest
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "xoa-support v${VERSION}" --notes-file /tmp/release-notes.md --latest \
              "$DEB" dist/SHA256SUMS
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]'
