[package]
name = "xcp-bundle-analyzer"
version = "0.6.10"
edition = "2021"
description = "Analyze XCP-ng / XenServer status-report (xen-bugtool) bundles"
license = "LGPL-2.1"

[[bin]]
name = "xcp-bundle-analyzer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bzip2 = "0.4"
flate2 = "1"
tar = "0.4"
# only deflate support — slims the binary and the parsing attack surface
# (no aes-crypto/lzma/zstd/...); stored and deflated entries still work
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
